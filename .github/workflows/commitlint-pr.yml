name: Validate Commit Messages

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  commit-validation:
    name: Enforce Commit Format & Sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PR Commits using local hook
        run: |
          chmod +x .githooks/commit-msg
          
          COMMITS=$(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }})
          
          for COMMIT in $COMMITS; do
            echo "Checking commit $COMMIT..."
            git log --format=%B -n 1 $COMMIT > /tmp/commit_msg.txt
            
            ./.githooks/commit-msg /tmp/commit_msg.txt
            
            if [ $? -ne 0 ]; then
              echo "❌ Commit $COMMIT is invalid. Please fix it (git commit --amend) and force push."
              exit 1
            fi
          done
          echo "✅ All commits comply with the Handbook rules."